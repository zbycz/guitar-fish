<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kytarová ladička</title>
<style>
  :root {
    --bg: #f7f6f2; --surface: #ffffff; --surface-1: #f1efe8;
    --text-primary: #2c2c2a; --text-secondary: #5f5e5a; --text-muted: #888780;
    --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.22);
    --success-bg: #e1f5ee; --success-text: #0f6e56; --success-border: #5dcaa5; --accent: #1d9e75;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --surface: #262624; --surface-1: #2f2f2c;
      --text-primary: #ececec; --text-secondary: #b4b2a9; --text-muted: #888780;
      --border: rgba(255,255,255,0.12); --border-strong: rgba(255,255,255,0.24);
      --success-bg: #085041; --success-text: #9fe1cb; --success-border: #1d9e75; --accent: #5dcaa5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 1rem; }
  .card { width: 100%; max-width: 460px; background: var(--surface);
    border: 0.5px solid var(--border); border-radius: 16px; padding: 2rem 1.5rem; text-align: center; }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 1.25rem; color: var(--text-secondary); }
  #note { font-size: 68px; font-weight: 500; color: var(--text-muted); line-height: 1; margin-bottom: 2px; }
  #freq { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
  #cents { font-size: 22px; font-weight: 500; color: var(--text-muted); margin-bottom: 16px; min-height: 26px; }
  .bar { position: relative; height: 44px; margin-bottom: 6px; background: var(--surface-1);
    border-radius: 10px; border: 0.5px solid var(--border); }
  .bar .center { position: absolute; left: 50%; top: 6px; bottom: 6px; width: 2px; background: var(--border-strong); transform: translateX(-50%); }
  .bar .tick { position: absolute; top: 14px; bottom: 14px; width: 1px; background: var(--border); }
  #slider { position: absolute; left: 50%; top: 4px; bottom: 4px; width: 6px; border-radius: 4px;
    background: var(--text-muted); transform: translateX(-50%); transition: left 0.06s linear, background 0.15s; }
  .scale { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted);
    margin-bottom: 14px; padding: 0 2px; }
  #trace { width: 100%; height: 180px; display: block; background: var(--surface-1);
    border-radius: 10px; border: 0.5px solid var(--border); margin-bottom: 16px; }
  .strings { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
  .strbtn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px;
    border-radius: 50%; border: 0.5px solid var(--border-strong); font-size: 14px;
    color: var(--text-secondary); background: var(--surface-1); transition: all 0.15s; }
  .strbtn.active { background: var(--success-bg); color: var(--success-text); border-color: var(--success-border); }
  button { width: 150px; height: 44px; font-size: 15px; border-radius: 10px;
    border: 0.5px solid var(--border-strong); background: var(--surface-1); color: var(--text-primary);
    cursor: pointer; transition: all 0.15s; }
  button:hover { border-color: var(--accent); }
  button:active { transform: scale(0.98); }
  .hint { font-size: 12px; color: var(--text-muted); margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>Kytarová ladička</h1>
  <div id="note">–</div>
  <div id="freq">stiskni start a zahraj strunu</div>
  <div id="cents">0 ct</div>

  <div class="bar">
    <div class="center"></div>
    <div class="tick" style="left:20%"></div>
    <div class="tick" style="left:80%"></div>
    <div id="slider"></div>
  </div>
  <div class="scale">
    <span>-50</span><span>utáhni ←</span><span>0</span><span>→ povol</span><span>+50 ct</span>
  </div>

  <canvas id="trace" width="460" height="180"></canvas>

  <div class="strings">
    <span data-str="E2" class="strbtn">E</span>
    <span data-str="A2" class="strbtn">A</span>
    <span data-str="D3" class="strbtn">D</span>
    <span data-str="G3" class="strbtn">G</span>
    <span data-str="B3" class="strbtn">B</span>
    <span data-str="E4" class="strbtn">e</span>
  </div>

  <button id="toggle">Start</button>
  <div class="hint">Vyžaduje mikrofon a HTTPS připojení</div>
</div>

<script>
(function(){
  const NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const noteEl = document.getElementById('note');
  const freqEl = document.getElementById('freq');
  const centsEl = document.getElementById('cents');
  const slider = document.getElementById('slider');
  const btn = document.getElementById('toggle');
  const strBtns = [...document.querySelectorAll('.strbtn')];
  const canvas = document.getElementById('trace');
  const ctx2d = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  let audioCtx, analyser, buf, sig, dec, decimation = 1, rafId, stream, running = false;
  let history = [];
  let recent = [];
  const MEDIAN_WINDOW = 12;
  const MIN_FREQ = 60, MAX_FREQ = 1300;
  const RMS_GATE = 0.008, CLARITY_GATE = 0.55, PEAK_RATIO = 0.9;

  function cssVar(name){ return getComputedStyle(document.body).getPropertyValue(name).trim() || '#888'; }

  function median(arr){
    if(!arr.length) return null;
    const s = [...arr].sort((a,b)=>a-b);
    const m = Math.floor(s.length/2);
    return s.length % 2 ? s[m] : (s[m-1]+s[m])/2;
  }

  function freqFromMidi(m){ return 440 * Math.pow(2,(m-69)/12); }

  function freqToNote(f){
    const n = 12 * (Math.log2(f/440)) + 69;
    const rounded = Math.round(n);
    return { midi: rounded };
  }

  function nsdfAt(x, W, lag){
    let ac = 0, sq = 0;
    for(let i=0;i<W;i++){
      const a = x[i], b = x[i+lag];
      ac += a*b; sq += a*a + b*b;
    }
    return sq > 0 ? 2*ac/sq : 0;
  }

  function parabolic(ym, y0, yp, x){
    const a = (ym + yp - 2*y0)/2, b = (yp - ym)/2;
    return a < 0 ? x - b/(2*a) : x;
  }

  function detectPitch(){
    const N = buf.length;
    let mean = 0;
    for(let i=0;i<N;i++) mean += buf[i];
    mean /= N;
    let power = 0;
    for(let i=0;i<N;i++){ const v = buf[i] - mean; sig[i] = v; power += v*v; }
    if(Math.sqrt(power/N) < RMS_GATE) return null;

    const D = decimation, M = dec.length;
    for(let i=0;i<M;i++){
      let s = 0;
      for(let k=0;k<D;k++) s += sig[i*D + k];
      dec[i] = s/D;
    }

    const rate = audioCtx.sampleRate;
    const maxLagD = Math.min(M - 32, Math.floor(rate/D/MIN_FREQ));
    const WD = M - maxLagD;
    if(maxLagD < 4 || WD < 64) return null;

    let lag = 1, v = 1;
    while(lag <= maxLagD && (v = nsdfAt(dec, WD, lag)) > 0) lag++;

    let peakLag = -1, peakVal = -1, globalVal = -1;
    const peaks = [];
    for(; lag <= maxLagD; lag++){
      v = nsdfAt(dec, WD, lag);
      if(v > 0){
        if(v > peakVal){ peakVal = v; peakLag = lag; }
      } else if(peakLag > 0){
        peaks.push([peakLag, peakVal]);
        if(peakVal > globalVal) globalVal = peakVal;
        peakLag = -1; peakVal = -1;
      }
    }
    if(peakLag > 0){
      peaks.push([peakLag, peakVal]);
      if(peakVal > globalVal) globalVal = peakVal;
    }
    if(!peaks.length || globalVal < CLARITY_GATE) return null;

    const thr = PEAK_RATIO * globalVal;
    let chosen = -1;
    for(const p of peaks){ if(p[1] >= thr){ chosen = p[0]; break; } }
    if(chosen < 1) return null;

    const maxLagFull = maxLagD * D;
    const WF = N - maxLagFull;
    const lo = Math.max(2, chosen*D - D), hi = Math.min(maxLagFull - 1, chosen*D + D);
    const vals = new Float64Array(hi - lo + 3);
    for(let l = lo - 1; l <= hi + 1; l++) vals[l - lo + 1] = nsdfAt(sig, WF, l);
    let rLag = -1, rVal = -1;
    for(let l = lo; l <= hi; l++){
      const x = vals[l - lo + 1];
      if(x > rVal){ rVal = x; rLag = l; }
    }
    if(rLag < 2) return null;

    const k = rLag - lo + 1;
    const tau = parabolic(vals[k-1], vals[k], vals[k+1], rLag);
    const freq = rate / tau;
    if(!(freq >= MIN_FREQ && freq <= MAX_FREQ)) return null;
    return { freq: freq, clarity: rVal };
  }

  function drawTrace(){
    ctx2d.clearRect(0,0,W,H);
    const cx = W/2;
    ctx2d.strokeStyle = cssVar('--border'); ctx2d.lineWidth = 1;
    [0.2, 0.8].forEach(p=>{ ctx2d.beginPath(); ctx2d.moveTo(W*p,0); ctx2d.lineTo(W*p,H); ctx2d.stroke(); });
    ctx2d.strokeStyle = cssVar('--border-strong');
    ctx2d.beginPath(); ctx2d.moveTo(cx,0); ctx2d.lineTo(cx,H); ctx2d.stroke();
    const good = cssVar('--success-text');
    const off = cssVar('--text-primary');
    for(let i=0;i<history.length;i++){
      const h = history[i];
      if(h === null) continue;
      const y = history.length - 1 - i;
      if(y >= H) continue;
      const clamped = Math.max(-50, Math.min(50, h));
      const x = cx + (clamped/50) * (W/2 - 8);
      const inTune = Math.abs(h) <= 5;
      ctx2d.fillStyle = inTune ? good : off;
      const w = inTune ? 8 : 5;
      ctx2d.fillRect(x - w/2, y, w, 3);
    }
  }

  function update(){
    analyser.getFloatTimeDomainData(buf);
    const det = detectPitch();
    if(det){
      const f = det.freq;
      const inst = freqToNote(f);
      const refInst = freqFromMidi(inst.midi);
      const instCents = 1200 * Math.log2(f / refInst);

      recent.push({ midi: inst.midi, cents: instCents });
      if(recent.length > MEDIAN_WINDOW) recent.shift();

      const midiMed = median(recent.map(r=>r.midi));
      const targetMidi = Math.round(midiMed);
      const centsMed = median(recent.filter(r=>r.midi===targetMidi).map(r=>r.cents));

      const name = NOTES[((targetMidi % 12) + 12) % 12];
      const octave = Math.floor(targetMidi/12) - 1;
      const cents = Math.round(centsMed);

      noteEl.textContent = name; noteEl.style.color = 'var(--text-primary)';
      freqEl.textContent = f.toFixed(1) + ' Hz · ' + name + octave;
      const clamped = Math.max(-50, Math.min(50, centsMed));
      slider.style.left = (50 + (clamped/50)*40) + '%';
      const inTune = Math.abs(cents) <= 4;
      slider.style.background = inTune ? 'var(--success-text)' : 'var(--text-primary)';
      centsEl.textContent = inTune ? '✓ naladěno' : ((cents>0?'+':'') + cents + ' ct');
      centsEl.style.color = inTune ? 'var(--success-text)' : 'var(--text-primary)';
      strBtns.forEach(b => b.classList.toggle('active', b.dataset.str === name+octave));
      history.push(instCents);
    } else {
      noteEl.style.color = 'var(--text-muted)';
      centsEl.textContent = '– ct'; centsEl.style.color = 'var(--text-muted)';
      slider.style.background = 'var(--text-muted)';
      history.push(null);
      if(recent.length) recent.shift();
    }
    if(history.length > H) history.shift();
    drawTrace();
    rafId = requestAnimationFrame(update);
  }

  async function start(){
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      decimation = Math.max(1, Math.pow(2, Math.round(Math.log2(audioCtx.sampleRate/24000))));
      analyser.fftSize = Math.min(32768, 2048 * decimation);
      analyser.smoothingTimeConstant = 0;
      buf = new Float32Array(analyser.fftSize);
      sig = new Float32Array(analyser.fftSize);
      dec = new Float32Array(analyser.fftSize / decimation);
      audioCtx.createMediaStreamSource(stream).connect(analyser);
      running = true; btn.textContent = 'Stop'; history = []; recent = [];
      update();
    } catch(e){
      freqEl.textContent = 'mikrofon nedostupný: ' + e.message;
    }
  }
  function stop(){
    running = false; btn.textContent = 'Start';
    cancelAnimationFrame(rafId);
    if(stream) stream.getTracks().forEach(t=>t.stop());
    if(audioCtx) audioCtx.close();
    noteEl.textContent = '–'; noteEl.style.color = 'var(--text-muted)';
    freqEl.textContent = 'stiskni start a zahraj strunu';
    centsEl.textContent = '0 ct'; centsEl.style.color = 'var(--text-muted)';
    slider.style.left = '50%'; slider.style.background = 'var(--text-muted)';
    strBtns.forEach(b=>b.classList.remove('active'));
    history = []; recent = []; drawTrace();
  }
  btn.addEventListener('click', ()=> running ? stop() : start());
  drawTrace();
})();
</script>
</body>
</html>
